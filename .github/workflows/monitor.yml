name: Flight monitor and Pages
on:
  schedule:
    - cron: '7 * 10-21 10 *'
    - cron: '22,37,52 * 10-21 10 *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [full, focus]
        default: full
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'public/data/**'
      - 'docs/**'
      - 'README.md'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: mf8455-monitor-pages
  cancel-in-progress: false
jobs:
  travel-window:
    if: github.event_name != 'schedule' || vars.MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      active: ${{ steps.window.outputs.active }}
    steps:
      - id: window
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(TZ=Asia/Shanghai date +%F)
          if [[ "$today" > "2026-10-21" ]]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/monitor.yml/disable"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi
  collect-and-build:
    needs: travel-window
    if: needs.travel-window.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      active: ${{ steps.window.outputs.active }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Stop automatic collection outside the travel window
        id: window
        run: |
          node --input-type=module -e "import {shanghaiDate} from './config.mjs'; import {appendFileSync} from 'node:fs'; appendFileSync(process.env.GITHUB_OUTPUT,'active='+(shanghaiDate()<='2026-10-21')+'\n')"
      - name: Install browser
        if: steps.window.outputs.active == 'true' && github.event_name != 'push'
        run: npx playwright install --with-deps chromium
      - name: Query official public fares
        if: steps.window.outputs.active == 'true' && github.event_name != 'push'
        env:
          SAVE_EVIDENCE: '1'
          MONITOR_MODE: ${{ github.event_name == 'schedule' && github.event.schedule == '22,37,52 * 10-21 10 *' && 'focus' || github.event.inputs.mode || 'full' }}
        run: |
          if [ "$MONITOR_MODE" = "focus" ]; then
            node scripts/monitor.mjs --focus
          else
            node scripts/monitor.mjs
          fi
      - name: Keep every snapshot, including failed observations
        if: steps.window.outputs.active == 'true' && github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots public/data
          if ! git diff --cached --quiet; then
            git commit -m "Record official flight fare observations"
            git push origin HEAD:main
          fi
      - name: Save diagnostic evidence
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: fare-evidence-${{ github.run_id }}
          path: |
            evidence/
            data/snapshots/
          retention-days: 7
          if-no-files-found: ignore
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: collect-and-build
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || needs.collect-and-build.outputs.active == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
